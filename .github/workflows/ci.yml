name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (pandoc, weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tui,web,dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Boundary check — enforced by tests/test_ai_boundary.py
        run: python -m pytest tests/test_ai_boundary.py -v

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: python -m pytest tests/ -q
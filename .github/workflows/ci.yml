name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (pandoc, weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tui,web,dev]"

      - name: Boundary check — enforced by tests/test_ai_boundary.py
        run: python -m pytest tests/test_ai_boundary.py -v

      - name: Ruff
        run: ruff check src tests || true

      - name: Pytest
        run: python -m pytest tests/ -q
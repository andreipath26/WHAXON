name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tui,web,dev]"

      - name: Boundary check — no AI imports in core or adapters
        run: |
          if grep -rn "from whaxon\.ai\|import whaxon\.ai" src/whaxon/core src/whaxon/adapters; then
            echo "::error::whaxon.ai must not be imported from core or adapters"
            exit 1
          fi
          echo "boundary ok"

      - name: Ruff
        run: ruff check src tests || true

      - name: Pytest
        run: python -m pytest tests/ -q
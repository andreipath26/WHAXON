name: Build Secure Lab
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: securelab-windows
          - os: ubuntu-latest
            artifact: securelab-linux
          - os: macos-latest
            artifact: securelab-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name SecureLab --collect-all paramiko --collect-all flask app/secure_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/SecureLab*

name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "MLCommons CLA bot check"
        if: (github.event.comment.body == 'recheck') || github.event_name == 'pull_request_target'
        uses: mlcommons/cla-bot@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/andreipath26/WHAXON/blob/main/CLA.md'
          branch: 'main'
          allowlist: andreipath26,bot*
          remote-organization-name: 'andreipath26'
          remote-repository-name: 'whaxon-cla-signatures'
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can review it, you must sign our Contributor License Agreement. Please read CLA.md at https://github.com/andreipath26/WHAXON/blob/main/CLA.md and then comment below with: I have read the CLA Document and I hereby sign the CLA'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'

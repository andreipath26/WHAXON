services:
  msf-target:
    image: tleemcjr/metasploitable2
    container_name: msf-target
    hostname: msf-target
    restart: unless-stopped
    command: ["/opt/entrypoint.sh"]
    networks:
      whaxon-lab:
        ipv4_address: 172.28.0.10
    volumes:
      - ./scripts/target-entrypoint.sh:/opt/entrypoint.sh:ro
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':445 ' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

networks:
  whaxon-lab:
    name: whaxon-lab
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

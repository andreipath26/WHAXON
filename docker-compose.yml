services:
  whaxon:
    build: .
    image: whaxon:latest
    container_name: whaxon
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      WHAXON_AUTH_USER: ${WHAXON_AUTH_USER:-whaxon}
      WHAXON_AUTH_PASS: ${WHAXON_AUTH_PASS:-whaxon}
      WHAXON_DATA: /data
    volumes:
      - ./data:/data:ro
      - whaxon_state:/var/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,base64,os; r=urllib.request.Request('http://127.0.0.1:5001/api/health'); r.add_header('Authorization','Basic '+base64.b64encode((os.environ['WHAXON_AUTH_USER']+':'+os.environ['WHAXON_AUTH_PASS']).encode()).decode()); urllib.request.urlopen(r, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  whaxon_state:

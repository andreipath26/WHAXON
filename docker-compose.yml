services:
  whaxon:
    build: .
    image: whaxon:latest
    container_name: whaxon
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      WHAXON_AUTH_USER: ${WHAXON_AUTH_USER:-whaxon}
      WHAXON_AUTH_PASS: ${WHAXON_AUTH_PASS:-whaxon}
      WHAXON_DATA: /data
      WHAXON_STATE: /var/state/whaxon.db
      HOME: /tmp
    volumes:
      - ./data:/data:ro
      - ./whaxon_state:/var/state
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0


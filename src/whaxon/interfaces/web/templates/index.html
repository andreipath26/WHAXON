{% extends "base.html" %}
{% block content %}
  <section class="card">
    <h2>Tool Catalog</h2>
    <p class="hint">Click a tool to select it.</p>
    <div id="catalog"></div>
    <h2 style="margin-top:16px">History</h2>
    <div id="history"></div>
  </section>

  <section class="card">
    <div class="selected-label" id="selected-label">selected: (none)</div>
    <div class="row">
      <input type="text" id="target" placeholder="host or URL, e.g. 127.0.0.1">
      <input type="text" id="extra" placeholder="extra args (optional)">
      <button id="run">Run</button>
      <button id="cancel" class="danger" disabled>Cancel</button>
    </div>
    <div id="status">ready</div>
    <div id="findings"></div>
    <details id="output-wrap">
      <summary>Raw output</summary>
      <div id="output"></div>
    </details>
  </section>
{% endblock %}

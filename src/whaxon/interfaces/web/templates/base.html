<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WHAXON</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div>
      <h1>WHAXON</h1>
      <div class="sub">Modular security testing platform</div>
    </div>
    <div class="header-actions">
      <input type="file" id="burp-file" accept=".xml" style="display:none">
      <button id="burp-upload" class="header-btn">Import Burp XML</button>
      <span id="import-status" class="hint"></span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

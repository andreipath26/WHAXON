<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WHAXON</title>
  <script>
    // Anti-flash: apply theme before CSS renders.
    (function() {
      try {
        var saved = localStorage.getItem('whaxon-theme') || 'system';
        var dark = saved === 'dark'
          || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=987db028">
</head>
<body>
  <header>
    <div>
      <h1>WHAXON</h1>
      <div class="sub">Modular security testing platform</div>
    </div>
    <div class="header-actions">
      <input type="file" id="burp-file" accept=".xml" style="display:none">
      <button id="burp-upload" class="header-btn">Import Burp XML</button>
        <button id="report-download" class="header-btn">Download Report</button>
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-value="light" title="Light" aria-label="Light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button type="button" data-theme-value="system" title="System" aria-label="System">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button type="button" data-theme-value="dark" title="Dark" aria-label="Dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      <span id="import-status" class="hint"></span>
    </div>
  </header>
  <div id="safety-banner" class="safety-banner" style="display:none"></div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}?v=eb11c48c"></script>
</body>
</html>

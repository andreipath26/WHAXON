[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whaxon"
version = "0.10.0"
description = "WHAXON — modular, portable cybersecurity testing platform"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andrei", email = "andreipath@gmail.com" }]
dependencies = [
    "platformdirs>=4.0",
]
keywords = [
    "security", "cybersecurity", "infosec", "pentest", "penetration-testing",
    "red-team", "offensive-security", "ethical-hacking",
    "vulnerability-assessment", "vulnerability-scanner", "security-tool",
    "nmap", "nikto", "sqlmap", "metasploit", "burp", "hashcat", "impacket",
    "recon", "reconnaissance", "enumeration", "exploitation", "post-exploitation",
    "scope-enforcement", "pivot", "port-forwarding",
    "cli", "tui", "textual", "web-ui", "flask", "gui", "pyside6",
    "ai", "automation",
    "python3", "devsecops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/andreipath26/WHAXON"
Repository = "https://github.com/andreipath26/WHAXON"
Issues = "https://github.com/andreipath26/WHAXON/issues"
Changelog = "https://github.com/andreipath26/WHAXON/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
tui = ["textual>=0.80", "rich>=13", "textual-image>=0.8"]
gui = ["PySide6>=6.7", "qasync>=0.27"]
web = ["flask>=3.0", "gunicorn>=21", "waitress>=3.0", "bcrypt>=4.0", "flask-limiter>=3.5", "markdown>=3.5"]
metasploit = ["pymetasploit3>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "twine>=5.0", "playwright>=1.64", "pytest-playwright>=0.10", "pytest-xdist>=3.6"]

[project.entry-points."whaxon.adapters"]
# External packages can declare adapters here. Example:
#   mytool = "my_package.adapter:MyAdapter"
# The loader in whaxon.adapters.registry discovers them at import time.

[project.scripts]
whaxon = "whaxon.cli:main"
whaxon-tui = "whaxon.interfaces.tui.app:main"
whaxon-gui = "whaxon.interfaces.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whaxon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
exclude = "(^|/)\\.venv/"
no_site_packages = true
ignore_missing_imports = true
# Third-party libs without complete stubs: suppress attr-defined only.
[[tool.mypy.overrides]]
module = ["textual.*", "PySide6.*", "waitress.*"]
ignore_errors = true
# Qt enum access is dynamic; the .* pattern above covers it.
[[tool.mypy.overrides]]
module = ["whaxon.interfaces.gui.*", "whaxon.interfaces.tui.*"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["whaxon.adapters.session", "whaxon.adapters.smb_session", "whaxon.adapters.wmi_session"]
disable_error_code = ["misc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Deliberate, codebase-wide patterns. Each ignore names why.
ignore = [
  "BLE001",  # blind-except: correlate/executor swallow by intent (session 57)
  "S110",    # try-except-pass: same design
  "S112",    # try-except-continue: same design
  "ISC004",  # implicit string concat: readable long arg lists
  "RUF012",  # mutable class default: adapter class-attr pattern
  "E501",    # line-too-long: formatting preference, reformat risks report strings
  "E701",    # multiple statements on one line (colon): style
  "E702",    # multiple statements on one line (semicolon): style
  "E741",    # ambiguous variable name: existing short loop vars
  "W292",    # missing newline at EOF: auto-fixable, not gating
  "W293",    # blank line with whitespace: auto-fixable, not gating
  "E402",    # module import not at top: sys.path bootstrap pattern in tests
  "SIM105",  # suppressible-exception: same try/except-pass design as S110/S112
  "UP031",   # printf-string-formatting: 32 sites across 10 files, own unit (roadmap)
  "SIM102",  # collapsible-if: if/elif pairs with different bodies, not collapsible
]

[tool.hatch.build.targets.sdist]
include = [
    "src/whaxon",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "docs/CHANGELOG.md",
]
exclude = [
    "archive",
    "assets",
    "data",
    "docs/assets",
    "tests",
    "scripts",
    ".github",
    "licensing",
    "THIRD_PARTY_LICENSES",
    "docker-compose.yml",
    "Dockerfile",
    "Makefile",
    "whaxon.service",
    ".env.example",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whaxon"
version = "0.2.0"
description = "WHAXON — modular, portable cybersecurity testing platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Andrei", email = "andreipath@gmail.com" }]
dependencies = [
    "platformdirs>=4.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80", "rich>=13", "textual-image>=0.8"]
gui = ["PySide6>=6.7", "qasync>=0.27"]
web = ["flask>=3.0", "gunicorn>=21", "bcrypt>=4.0", "flask-limiter>=3.5", "markdown>=3.5"]
metasploit = ["pymetasploit3>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.entry-points."whaxon.adapters"]
# External packages can declare adapters here. Example:
#   mytool = "my_package.adapter:MyAdapter"
# The loader in whaxon.adapters.registry discovers them at import time.

[project.scripts]
whaxon = "whaxon.cli:main"
whaxon-tui = "whaxon.interfaces.tui.app:main"
whaxon-gui = "whaxon.interfaces.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whaxon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whaxon"
version = "0.3.0"
description = "WHAXON — modular, portable cybersecurity testing platform"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andrei", email = "andreipath@gmail.com" }]
dependencies = [
    "platformdirs>=4.0",
]
keywords = [
    "security", "cybersecurity", "infosec", "pentest", "penetration-testing",
    "red-team", "offensive-security", "ethical-hacking",
    "vulnerability-assessment", "vulnerability-scanner", "security-tool",
    "nmap", "nikto", "sqlmap", "metasploit", "burp", "hashcat", "impacket",
    "recon", "reconnaissance", "enumeration", "exploitation", "post-exploitation",
    "scope-enforcement", "pivot", "port-forwarding",
    "cli", "tui", "textual", "web-ui", "flask", "gui", "pyside6",
    "ai", "automation",
    "python3", "devsecops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/andreipath26/WHAXON"
Repository = "https://github.com/andreipath26/WHAXON"
Issues = "https://github.com/andreipath26/WHAXON/issues"
Changelog = "https://github.com/andreipath26/WHAXON/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
tui = ["textual>=0.80", "rich>=13", "textual-image>=0.8"]
gui = ["PySide6>=6.7", "qasync>=0.27"]
web = ["flask>=3.0", "gunicorn>=21", "bcrypt>=4.0", "flask-limiter>=3.5", "markdown>=3.5"]
metasploit = ["pymetasploit3>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.entry-points."whaxon.adapters"]
# External packages can declare adapters here. Example:
#   mytool = "my_package.adapter:MyAdapter"
# The loader in whaxon.adapters.registry discovers them at import time.

[project.scripts]
whaxon = "whaxon.cli:main"
whaxon-tui = "whaxon.interfaces.tui.app:main"
whaxon-gui = "whaxon.interfaces.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whaxon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
